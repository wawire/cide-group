name: Deploy (Vultr SSH)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP_BASE="/var/www"
            if ! mkdir -p "$APP_BASE" 2>/dev/null || [ ! -w "$APP_BASE" ]; then
              APP_BASE="$HOME"
              mkdir -p "$APP_BASE"
            fi
            APP_DIR="$APP_BASE/cide-group"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://x-access-token:${{ secrets.REPO_PULL_TOKEN }}@github.com/wawire/cide-group.git "$APP_DIR"
            fi

            echo "Using APP_DIR=$APP_DIR"
            cd "$APP_DIR"
            git remote set-url origin https://x-access-token:${{ secrets.REPO_PULL_TOKEN }}@github.com/wawire/cide-group.git
            git fetch --all
            git checkout main
            git pull origin main
            npm ci
            npm run build
            npx pm2 startOrReload ecosystem.config.cjs --update-env
            npx pm2 save
            curl -fsS http://127.0.0.1:3000/api/health
