name: Deploy → Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to Vultr via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASS: ${{ secrets.VULTR_SUDO_PASS }}
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          envs: SUDO_PASS
          script: |
            set -e
            APP_DIR="$HOME/cide-group"

            echo "── Clone or update repo ─────────────────"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/wawire/cide-group.git "$APP_DIR"
              # Copy env secrets from original location if present
              if [ -f /var/www/cide-group/.env.production.local ]; then
                cp /var/www/cide-group/.env.production.local "$APP_DIR/.env.production.local"
                echo "✓ Copied .env.production.local"
              fi
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$APP_DIR"

            echo "── Git HEAD ─────────────────────────────"
            git log --oneline -1

            echo "── next.config.mjs script-src lines ─────"
            grep "script-src" next.config.mjs || echo "NOT FOUND"

            echo "── Sync env secrets ─────────────────────"
            if [ -f /var/www/cide-group/.env.production.local ]; then
              cp /var/www/cide-group/.env.production.local "$APP_DIR/.env.production.local"
              echo "✓ Synced .env.production.local"
            elif [ ! -f "$APP_DIR/.env.production.local" ]; then
              echo "⚠ .env.production.local missing — SMTP will not work"
            else
              echo "✓ .env.production.local already present"
            fi

            echo "── Installing dependencies ──────────────"
            npm ci --prefer-offline

            echo "── Clean build ──────────────────────────"
            rm -rf .next
            npm run build

            echo "── Fix nginx conflicts (disable old site configs) ───────────────"
            # Find all enabled configs that claim cidegroup.org but do NOT proxy to port 3000
            for ENABLED in /etc/nginx/sites-enabled/*; do
              if ! echo "$SUDO_PASS" | sudo -S test -f "$ENABLED" 2>/dev/null; then continue; fi
              HAS_DOMAIN=$(echo "$SUDO_PASS" | sudo -S grep -l "server_name.*cidegroup\.org" "$ENABLED" 2>/dev/null || true)
              if [ -z "$HAS_DOMAIN" ]; then continue; fi
              HAS_PROXY=$(echo "$SUDO_PASS" | sudo -S grep -c "proxy_pass.*127\.0\.0\.1:3000" "$ENABLED" 2>/dev/null || echo "0")
              if [ "$HAS_PROXY" = "0" ]; then
                echo "  ✗ Disabling old config: $ENABLED"
                echo "$SUDO_PASS" | sudo -S rm -f "$ENABLED"
              else
                echo "  ✓ Keeping (proxies to 3000): $ENABLED"
              fi
            done

            echo "── Ensure Next.js app nginx config is enabled ───────────────────"
            # Determine the right sites-available config
            for CONF in /etc/nginx/sites-available/cidegroup.org /etc/nginx/sites-available/cidegroup.conf; do
              if echo "$SUDO_PASS" | sudo -S test -f "$CONF" 2>/dev/null; then
                AVAIL_CONF="$CONF"
                CONF_NAME=$(basename "$CONF")
                break
              fi
            done
            if [ -z "$AVAIL_CONF" ]; then
              # Write minimal reverse proxy config via temp file (avoids heredoc YAML issues)
              TMPCONF=$(mktemp)
              printf 'server {\n    listen 80;\n    server_name cidegroup.org www.cidegroup.org;\n    return 301 https://$host$request_uri;\n}\nserver {\n    listen 443 ssl;\n    server_name cidegroup.org www.cidegroup.org;\n    ssl_certificate /etc/letsencrypt/live/cidegroup.org/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/cidegroup.org/privkey.pem;\n    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection upgrade;\n        proxy_set_header Host $host;\n        proxy_cache_bypass $http_upgrade;\n    }\n}\n' > "$TMPCONF"
              echo "$SUDO_PASS" | sudo -S cp "$TMPCONF" /etc/nginx/sites-available/cidegroup.org
              rm -f "$TMPCONF"
              AVAIL_CONF="/etc/nginx/sites-available/cidegroup.org"
              CONF_NAME="cidegroup.org"
              echo "  ✓ Created minimal proxy config at $AVAIL_CONF"
            fi
            # Symlink if not already enabled
            if ! echo "$SUDO_PASS" | sudo -S test -L "/etc/nginx/sites-enabled/$CONF_NAME" 2>/dev/null; then
              echo "$SUDO_PASS" | sudo -S ln -sf "$AVAIL_CONF" "/etc/nginx/sites-enabled/$CONF_NAME"
              echo "  ✓ Symlinked $CONF_NAME into sites-enabled"
            else
              echo "  ✓ $CONF_NAME already in sites-enabled"
            fi

            echo "── Patch nginx to force correct CSP ─────────────────────────────"
            CSP_VALUE="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://images.pexels.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
            for CONF in /etc/nginx/sites-available/cidegroup.org /etc/nginx/sites-available/cidegroup.conf; do
              if ! echo "$SUDO_PASS" | sudo -S test -f "$CONF" 2>/dev/null; then
                echo "skip $CONF (not found)"
                continue
              fi
              if echo "$SUDO_PASS" | sudo -S grep -q "script-src-elem.*unsafe-inline" "$CONF" 2>/dev/null; then
                echo "✓ $CONF already patched"
                continue
              fi
              echo "$SUDO_PASS" | sudo -S sed -i '/add_header Content-Security-Policy/d' "$CONF"
              echo "$SUDO_PASS" | sudo -S sed -i '/proxy_hide_header Content-Security-Policy/d' "$CONF"
              echo "$SUDO_PASS" | sudo -S sed -i "s|proxy_pass http://127\.0\.0\.1:3000;|proxy_pass http://127.0.0.1:3000;\n        proxy_hide_header Content-Security-Policy;\n        add_header Content-Security-Policy \"$CSP_VALUE\" always;|" "$CONF"
              echo "✓ Patched $CONF"
            done
            echo "$SUDO_PASS" | sudo -S nginx -t && \
              echo "$SUDO_PASS" | sudo -S nginx -s reload && \
              echo "✓ nginx reloaded" || echo "✗ nginx config error — check manually"

            echo "── Kill everything on port 3000 ─────────────────────────────────"
            echo "$SUDO_PASS" | sudo -S ss -tlnp | grep ':3000' || echo "nothing on 3000"
            # Kill our own PM2 daemon (previous deploys)
            pm2 kill 2>/dev/null || true
            # sudo ss to see root-owned PIDs, then kill them all
            echo "$SUDO_PASS" | sudo -S bash -c '
              PIDS=$(ss -tlnp | grep ":3000" | grep -oP "pid=\K[0-9]+" | sort -u)
              if [ -n "$PIDS" ]; then
                echo "Killing PIDs: $PIDS"
                echo "$PIDS" | xargs kill -9
              else
                echo "port 3000 already free"
              fi
            ' 2>/dev/null || true
            sleep 2
            echo "$SUDO_PASS" | sudo -S ss -tlnp | grep ':3000' || echo "✓ port 3000 is free"

            echo "── Restarting PM2 ───────────────────────"
            pm2 stop cidegroup-web 2>/dev/null || true
            pm2 delete cidegroup-web 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            sleep 3
            echo "── PM2 status ───────────────────────────"
            pm2 list

            echo "── CSS hash check ───────────────────────"
            curl -s http://127.0.0.1:3000 | grep -o 'static/css/[^"]*' | head -1

            echo "── CSP from Next.js (port 3000 direct) ──"
            curl -sI http://127.0.0.1:3000 | grep -i "content-security-policy" || echo "no CSP header on port 3000"

            echo "── Health check ─────────────────────────"
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo "✓ App is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 3s..."
              sleep 3
            done
            echo "✗ Health check failed"
            pm2 logs cidegroup-web --lines 50 --nostream
            exit 1
