name: Deploy → Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to Vultr via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e
            APP_DIR=/var/www/cide-group

            echo "── Pulling latest code ──────────────────"
            git config --global --add safe.directory "$APP_DIR"
            cd "$APP_DIR"
            git pull origin main

            echo "── Installing dependencies ──────────────"
            npm ci --prefer-offline

            echo "── Clean build ──────────────────────────"
            rm -rf .next
            npm run build

            echo "── Restarting PM2 ───────────────────────"
            pm2 stop cidegroup-web 2>/dev/null || true
            pm2 delete cidegroup-web 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            echo "── Health check ─────────────────────────"
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo "✓ App is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 3s..."
              sleep 3
            done
            echo "✗ Health check failed"
            pm2 logs cidegroup-web --lines 50 --nostream
            exit 1
