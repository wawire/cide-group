name: Deploy → Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to Vultr via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASS: ${{ secrets.VULTR_SUDO_PASS }}
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          envs: SUDO_PASS
          script: |
            set -e
            APP_DIR="$HOME/cide-group"

            echo "── Clone or update repo ─────────────────"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/wawire/cide-group.git "$APP_DIR"
              # Copy env secrets from original location if present
              if [ -f /var/www/cide-group/.env.production.local ]; then
                cp /var/www/cide-group/.env.production.local "$APP_DIR/.env.production.local"
                echo "✓ Copied .env.production.local"
              fi
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$APP_DIR"

            echo "── Git HEAD ─────────────────────────────"
            git log --oneline -1

            echo "── next.config.mjs script-src lines ─────"
            grep "script-src" next.config.mjs || echo "NOT FOUND"

            echo "── Sync env secrets ─────────────────────"
            if [ -f /var/www/cide-group/.env.production.local ]; then
              cp /var/www/cide-group/.env.production.local "$APP_DIR/.env.production.local"
              echo "✓ Synced .env.production.local"
            elif [ ! -f "$APP_DIR/.env.production.local" ]; then
              echo "⚠ .env.production.local missing — SMTP will not work"
            else
              echo "✓ .env.production.local already present"
            fi

            echo "── Installing dependencies ──────────────"
            npm ci --prefer-offline

            echo "── Clean build ──────────────────────────"
            rm -rf .next
            npm run build

            echo "── Fix nginx CSP (script-src-elem needs unsafe-inline) ──────────"
            NGINX_CONF=$(echo "$SUDO_PASS" | sudo -S grep -rl "script-src-elem" /etc/nginx/ 2>/dev/null | head -1)
            if [ -n "$NGINX_CONF" ]; then
              echo "Found CSP in: $NGINX_CONF"
              echo "$SUDO_PASS" | sudo -S sed -i \
                "s|script-src-elem 'self' https://www\.googletagmanager\.com|script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com|g" \
                "$NGINX_CONF"
              echo "$SUDO_PASS" | sudo -S nginx -t && \
                echo "$SUDO_PASS" | sudo -S nginx -s reload && \
                echo "✓ nginx CSP patched and reloaded" || echo "✗ nginx reload failed"
            else
              echo "✓ nginx CSP: no hardcoded script-src-elem found (Next.js headers are in control)"
            fi

            echo "── Kill everything on port 3000 ─────────────────────────────────"
            echo "$SUDO_PASS" | sudo -S ss -tlnp | grep ':3000' || echo "nothing on 3000"
            # Kill our own PM2 daemon (previous deploys)
            pm2 kill 2>/dev/null || true
            # sudo ss to see root-owned PIDs, then kill them all
            echo "$SUDO_PASS" | sudo -S bash -c '
              PIDS=$(ss -tlnp | grep ":3000" | grep -oP "pid=\K[0-9]+" | sort -u)
              if [ -n "$PIDS" ]; then
                echo "Killing PIDs: $PIDS"
                echo "$PIDS" | xargs kill -9
              else
                echo "port 3000 already free"
              fi
            ' 2>/dev/null || true
            sleep 2
            echo "$SUDO_PASS" | sudo -S ss -tlnp | grep ':3000' || echo "✓ port 3000 is free"

            echo "── Restarting PM2 ───────────────────────"
            pm2 stop cidegroup-web 2>/dev/null || true
            pm2 delete cidegroup-web 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            sleep 3
            echo "── PM2 status ───────────────────────────"
            pm2 list

            echo "── CSS hash check ───────────────────────"
            curl -s http://127.0.0.1:3000 | grep -o 'static/css/[^"]*' | head -1

            echo "── CSP from Next.js (port 3000 direct) ──"
            curl -sI http://127.0.0.1:3000 | grep -i "content-security-policy" || echo "no CSP header on port 3000"

            echo "── Dump full nginx config for cidegroup ─"
            echo "$SUDO_PASS" | sudo -S bash -c '
              echo "--- sites-enabled:"
              ls /etc/nginx/sites-enabled/
              echo "--- conf.d:"
              ls /etc/nginx/conf.d/ 2>/dev/null || echo "empty"
              echo "--- proxy_pass to 3000 (all configs):"
              grep -r "proxy_pass.*:3000" /etc/nginx/ 2>/dev/null | grep -v ".bak"
              echo "--- add_header across all configs:"
              grep -rn "add_header" /etc/nginx/ 2>/dev/null | grep -v ".bak\|#"
              echo "--- cidegroup in all configs:"
              grep -rl "cidegroup\|3000" /etc/nginx/ 2>/dev/null | grep -v ".bak"
            ' 2>/dev/null || echo "sudo dump failed"

            echo "── Health check ─────────────────────────"
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo "✓ App is healthy"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 3s..."
              sleep 3
            done
            echo "✗ Health check failed"
            pm2 logs cidegroup-web --lines 50 --nostream
            exit 1
