name: Deploy (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, cidegroup]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Reload app with PM2
        env:
          NODE_ENV: production
          PORT: 3000
        run: |
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

      - name: Health check
        run: curl -f http://127.0.0.1:3000/api/health
