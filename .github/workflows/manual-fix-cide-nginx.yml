name: Manual Fix CIDE Nginx

on:
  workflow_dispatch:

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Configure cidegroup.org nginx proxy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          envs: VULTR_PASSWORD
          script: |
            set -e
            TS=$(date +%Y%m%d%H%M%S)
            sudo_with_password() {
              echo "$VULTR_PASSWORD" | sudo -S "$@"
            }

            sudo_with_password cp /etc/nginx/sites-available/cidegroup.org /etc/nginx/sites-available/cidegroup.org.bak.$TS

            sudo_with_password python3 -c "from pathlib import Path; Path('/etc/nginx/sites-available/cidegroup.org').write_text('''server {\n    listen 80;\n    listen [::]:80;\n    server_name cidegroup.org www.cidegroup.org;\n\n    location /.well-known/acme-challenge/ {\n        root /var/www/certbot;\n    }\n\n    location / {\n        return 301 https://\$host\$request_uri;\n    }\n}\n\nserver {\n    listen 443 ssl;\n    listen [::]:443 ssl;\n    server_name cidegroup.org www.cidegroup.org;\n\n    ssl_certificate /etc/letsencrypt/live/cidegroup.org/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/cidegroup.org/privkey.pem;\n    include /etc/letsencrypt/options-ssl-nginx.conf;\n    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;\n\n    add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\" always;\n    add_header X-Frame-Options \"DENY\" always;\n    add_header X-Content-Type-Options \"nosniff\" always;\n    add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\n\n    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_http_version 1.1;\n        proxy_set_header Host \$host;\n        proxy_set_header X-Real-IP \$remote_addr;\n        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto \$scheme;\n        proxy_set_header Upgrade \$http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_cache_bypass \$http_upgrade;\n    }\n}\n''', encoding='utf-8')"
            sudo_with_password nginx -t
            sudo_with_password systemctl reload nginx

            curl -I -sS -H "Host: www.cidegroup.org" http://127.0.0.1/ | head -n 1
            curl -I -sS -H "Host: www.cidegroup.org" http://127.0.0.1/about | head -n 1
        env:
          VULTR_PASSWORD: ${{ secrets.VULTR_PASSWORD }}
