name: Provision Vultr SSH Key

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Add deploy key to authorized_keys
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          password: ${{ secrets.VULTR_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            PUB_KEY='${{ secrets.VULTR_SSH_PUBLIC_KEY }}'
            if ! grep -Fq "$PUB_KEY" ~/.ssh/authorized_keys; then
              echo "$PUB_KEY" >> ~/.ssh/authorized_keys
            fi
            echo "Key provisioned for user $(whoami)"
