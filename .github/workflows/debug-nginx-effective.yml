name: Debug Nginx Effective Config

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump effective nginx config for cidegroup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          envs: VULTR_PASSWORD
          script: |
            set -e
            echo "$VULTR_PASSWORD" | sudo -S nginx -T > /tmp/nginx_dump.txt 2>&1 || true
            echo "=== server_name lines (cidegroup) ==="
            grep -n "server_name .*cidegroup.org" /tmp/nginx_dump.txt || true
            echo "=== include order hint ==="
            grep -n "sites-enabled" /tmp/nginx_dump.txt | head -n 40 || true
