name: Manual Server Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect app and nginx state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "== whoami =="
            whoami
            echo "== app health =="
            curl -i -sS http://127.0.0.1:3000/api/health || true
            echo "== pm2 status =="
            npx pm2 ls || true
            echo "== nginx local root response =="
            curl -I -sS http://127.0.0.1/ || true
            echo "== nginx local /about response =="
            curl -I -sS http://127.0.0.1/about || true
            echo "== sudo check =="
            sudo -n true && echo "sudo_nopasswd=yes" || echo "sudo_nopasswd=no"
            echo "== nginx enabled sites =="
            ls -la /etc/nginx/sites-enabled || true
            echo "== cidegroup site conf =="
            sudo -n cat /etc/nginx/sites-enabled/cidegroup.org || true
